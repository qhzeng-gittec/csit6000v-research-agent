<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scholar Agent</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-logo" viewBox="0 0 24 24"><path d="M5 4.5h9.5a3 3 0 0 1 3 3V19.5H8a3 3 0 0 1-3-3z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="m8.6 11.6 2.2 2.2 4-4.3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M7 3.5h7l4 4V20.5H7z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M14 3.5v4h4M9.5 12h6M9.5 15.5h6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-clip" viewBox="0 0 24 24"><path d="m19 11.5-7.2 7.2a4.2 4.2 0 0 1-6-6l7.6-7.5a2.8 2.8 0 0 1 4 4L10 16.500a1.400 1.400 0 0 1-2-2l6.600-6.500" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 2.800 19.500h18.400z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 10v4.500M12 17.200v.100" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.500 12S6 5.500 12 5.500 21.500 12 21.500 12 18 18.500 12 18.500 2.500 12 2.500 12z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.700" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
  <symbol id="i-term" viewBox="0 0 24 24"><rect x="3" y="4.500" width="18" height="15" rx="2.500" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m7 10 3 2.500-3 2.500M12.500 15h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="m13 7 4 4" stroke="currentColor" stroke-width="1.7"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3.500 5 6v5.500c0 4.300 2.900 7.400 7 9 4.100-1.600 7-4.700 7-9V6z" fill="none" stroke="currentColor" stroke-width="1.700" stroke-linejoin="round"/><path d="m9 12 2.200 2.200L15.200 10" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M4 12h10a6 6 0 0 1 6 6" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.500v13l10.500-6.500z" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linejoin="round"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4.500" width="18" height="15" rx="2.500" fill="none" stroke="currentColor" stroke-width="1.700"/><path d="M14 4.500v15" stroke="currentColor" stroke-width="1.700"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.500" y="8.500" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.700"/><path d="M15.500 5.500v-1h-11v11h1" fill="none" stroke="currentColor" stroke-width="1.700" stroke-linejoin="round"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3.500 13.800 10l6.700 2-6.700 2L12 20.500 10.200 14l-6.700-2 6.700-2z" fill="none" stroke="currentColor" stroke-width="1.600" stroke-linejoin="round"/></symbol>
</svg>

<div class="app" id="app">
  <aside class="sidebar" aria-label="Saved runs">
    <div class="brand">Scholar Agent</div>
    <button class="new" id="new" type="button">New question<svg><use href="#i-plus"/></svg></button>
    <label class="search"><svg><use href="#i-search"/></svg><input id="search" type="search" placeholder="Search questions" autocomplete="off"></label>
    <div class="scope">
      <div class="picker" id="collection">
        <button type="button" class="pick" aria-haspopup="listbox" aria-expanded="false" aria-label="Collection of saved runs"><span></span><svg><use href="#i-chev"/></svg></button>
        <div class="menu" role="listbox" hidden></div>
      </div>
      <div class="tabs" id="filters" role="tablist"></div>
    </div>
    <nav class="runs" id="runs"></nav>
    <div class="model" id="model"></div>
  </aside>

  <main class="chat">
    <header class="topbar">
      <div class="context" id="context">New question</div>
      <div class="arms" id="arms" hidden></div>
      <div class="picker" id="arm-picker" hidden>
        <button type="button" class="pick" aria-haspopup="listbox" aria-expanded="false" aria-label="Configuration"><span></span><svg><use href="#i-chev"/></svg></button>
        <div class="menu" role="listbox" hidden></div>
      </div>
      <span class="grow"></span>
      <button class="ghost" id="replay" type="button" hidden><svg><use href="#i-play"/></svg>Replay</button>
      <button class="ghost icon" id="toggle-source" type="button" title="Show or hide the document" hidden><svg><use href="#i-panel"/></svg></button>
    </header>

    <div class="thread" id="thread"></div>

    <form class="composer" id="composer" autocomplete="off">
      <div class="notice" id="notice" hidden></div>
      <div class="box" id="box">
        <div class="attached" id="attached" hidden></div>
        <textarea id="question" rows="1" placeholder="Ask a question about the document"></textarea>
        <div class="row">
          <button class="ghost" id="attach" type="button"><svg><use href="#i-clip"/></svg>Document</button>
          <div class="mode" id="mode" role="radiogroup" aria-label="System">
            <button type="button" role="radio" data-mode="full" aria-checked="true" title="Full system: answers with word-for-word quotes, and a verifier checks every quote against the document"><svg><use href="#i-shield"/></svg>Full system</button>
            <button type="button" role="radio" data-mode="plain" aria-checked="false" title="The same agent without quotes and without the verifier">Plain agent</button>
          </div>
          <span class="grow"></span>
          <button class="send" id="send" type="submit" title="Ask" disabled><svg><use href="#i-send"/></svg></button>
        </div>
      </div>
      <p class="fine">Each question is answered from the document only. Quotes marked <span class="k ok">verified</span> exist word for word in the document.</p>
      <input id="file" type="file" accept=".txt,.md,.markdown,text/plain,text/markdown" hidden>
    </form>
  </main>

  <aside class="source" id="source" aria-label="Source document">
    <header>
      <div class="name"><svg><use href="#i-doc"/></svg><span id="doc-name">Document</span></div>
      <div class="nav" id="quote-nav" hidden>
        <button class="ghost icon" id="prev-quote" type="button" title="Previous quote"><svg style="transform:rotate(180deg)"><use href="#i-chev"/></svg></button>
        <span id="quote-pos"></span>
        <button class="ghost icon" id="next-quote" type="button" title="Next quote"><svg><use href="#i-chev"/></svg></button>
      </div>
      <button class="ghost icon" id="close-source" type="button" title="Hide the document"><svg><use href="#i-x"/></svg></button>
    </header>
    <div class="legend" id="legend"></div>
    <div class="doc" id="doc"></div>
  </aside>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="card" role="dialog" aria-label="Add a document">
    <h2>Add a document</h2>
    <p>Paste the text, or choose a .txt or .md file. The agent reads it with read-only tools.</p>
    <input id="paste-name" type="text" placeholder="Name (optional)">
    <textarea id="paste" rows="12" placeholder="Paste the document text here"></textarea>
    <div class="row">
      <button class="ghost" id="choose" type="button"><svg><use href="#i-clip"/></svg>Choose a file</button>
      <span class="grow"></span>
      <button class="ghost" id="cancel-doc" type="button">Cancel</button>
      <button class="primary" id="use-doc" type="button">Use this document</button>
    </div>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
